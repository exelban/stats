name: Bug report
description: Report a new problem with Stats after checking the FAQ and existing issues.

body:
  - type: markdown
    attributes:
      value: |
        Report one problem per issue. **Do not open a new issue for a topic already covered, including closed issues.** React or add new diagnostic information to the existing issue when comments are open. Respect the maintainer's decision on closed or locked issues.

        macOS beta versions are not supported. Fan control is in legacy mode and does not receive support or fixes; see the [fan control FAQ](https://github.com/exelban/stats#fan-control).

        Duplicate or incomplete reports may be closed without a response.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the [FAQ](https://github.com/exelban/stats#faqs) and searched [open and closed issues](https://github.com/exelban/stats/issues?q=is%3Aissue) and found no existing report or answer covering this problem.
          required: true
        - label: I reproduced the problem with the [latest Stats release](https://github.com/exelban/stats/releases/latest) on a [supported, stable macOS release](https://github.com/exelban/stats#requirements).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead. Include any error messages or incorrect readings.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the steps needed to reproduce the problem. If the trigger is unknown, describe what you were doing when it happened.
      placeholder: |
        1. Open Stats...
        2. Enable or configure...
        3. Perform...
        4. Observe...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Enter the exact Stats and macOS versions (not just "latest"), plus your Mac model and chip or processor.
      placeholder: |
        Stats version:
        macOS version:
        Mac model and chip:
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Attachments and context
      description: |
        Add screenshots, recordings, relevant settings, or troubleshooting results if useful.

        If Stats crashed, attach the complete report as a `.txt` or `.zip` file, or paste it in a fenced code block. Find it in [Console > Crash Reports](https://support.apple.com/guide/console/reports-cnsl664be99a/mac).
