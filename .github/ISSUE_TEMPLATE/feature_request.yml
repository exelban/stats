name: Feature request
description: Propose a new feature after checking the FAQ and existing requests.

body:
  - type: markdown
    attributes:
      value: |
        Request one feature per issue. **Do not open a new issue for a topic already covered, including closed or declined requests.** React or add new information to the existing issue when comments are open. Respect the maintainer's decision on closed or locked issues.

        Duplicate or incomplete requests may be closed without a response.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched [open issues](https://github.com/exelban/stats/issues?q=is%3Aissue%20is%3Aopen) and found no existing request for this feature.
          required: true
        - label: I searched [closed issues](https://github.com/exelban/stats/issues?q=is%3Aissue%20is%3Aclosed) and found no previous request or decision covering this feature.
          required: true
        - label: I read the [README and FAQ](https://github.com/exelban/stats#readme) and checked that the feature is not already available in the [latest release](https://github.com/exelban/stats/releases/latest).
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you are trying to accomplish and how Stats currently falls short.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed feature
      description: Describe the behavior you want, where it would appear in Stats, and how it would solve the problem.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add workarounds you considered, mockups, screenshots, or references if useful.
