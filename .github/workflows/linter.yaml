name: Linter

on:
  push:
    paths:
      - '.github/workflows/linter.yaml'
      - '.swiftlint.yml'
      - 'Stats.xcodeproj/**'
      - 'Kit/scripts/run-smc-tests.py'
      - '**/*.swift'
  pull_request:
    paths:
      - '.github/workflows/linter.yaml'
      - '.swiftlint.yml'
      - 'Stats.xcodeproj/**'
      - 'Kit/scripts/run-smc-tests.py'
      - '**/*.swift'

jobs:
  SwiftLint:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint 0.65.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip -o swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  swiftlint.zip" | shasum -a 256 -c -
          unzip -q swiftlint.zip -d swiftlint-bin
          echo "$RUNNER_TEMP/swiftlint-bin" >> "$GITHUB_PATH"
      - run: swiftlint lint --strict --no-cache --reporter github-actions-logging
      - name: Build app and test targets for analysis
        shell: bash
        run: |
          xcodebuild -scheme Stats -destination 'platform=macOS' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" build-for-testing CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"
      - run: swiftlint analyze --strict --compiler-log-path "$RUNNER_TEMP/build.log" --reporter github-actions-logging
      - name: Analyze standalone SMC tests
        run: python3 Kit/scripts/run-smc-tests.py --analyze
