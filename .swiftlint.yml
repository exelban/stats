disabled_rules:
  - force_cast # todo
  - type_name # todo
  - cyclomatic_complexity # todo
  - opening_brace
  - implicit_getter
  - implicit_optional_initialization
  - large_tuple
  - function_body_length

opt_in_rules:
  - control_statement
  - empty_count
  - trailing_newline
  - colon
  - comma
  - contains_over_filter_is_empty
  - first_where
  - contains_over_first_not_nil
  - discarded_notification_center_observer
  - unhandled_throwing_task
  - identical_operands
  - redundant_nil_coalescing
  - empty_string

analyzer_rules:
  - explicit_self

custom_rules:
  blank_line_indentation:
    regex: >-
      (?mx)^(?=([\t\ ]*)\S)
      (?:
        \1guard\b(?:[^\r\n]*,\r?\n[\t\ ]+)+[^\r\n]*\belse[\t\ ]*\{[^\r\n]*\}
        |
        (?!(?:(?<=,\n)|(?<=,\r\n))\1(?!guard\b)[^\r\n]*\belse[\t\ ]*\{[^\r\n]*\}$)
        \1\S[^\r\n]*
      )
      \r?\n(?!\1\r?$)([\t\ ]*\r?\n)
    capture_group: 2
    message: "Indent the blank line to match the preceding line or the start of the multiline guard."
    severity: warning

identifier_name:
  min_length: 1
  excluded:
    - AppUpdateIntervals
    - TemperatureUnits
    - SpeedBase
    - SensorsWidgetMode
    - SpeedPictogram
    - BatteryAdditionals
    - ShortLong
    - ReaderUpdateIntervals
    - NumbersOfProcesses
    - NetworkReaders
    - SensorsList
    - Alignments
    - _devices
    - _uuidAddress
    - AppleSiliconSensorsList
    - FanValues
    - CombinedModulesSpacings
    - BatteryInfo
    - PublicIPAddressRefreshIntervals
    - _values
    - _writeTS
    - LineChartHistory
    - SpeedPictogramColor
    - SensorsWidgetValue
    - access_token
    - refresh_token
    - device_code
    - user_code
    - verification_uri_complete
    - expires_in
    - NetworkSpeedUnitAuto
    - NetworkSpeedUnits

line_length: 200

trailing_whitespace:
  ignores_empty_lines: true

type_body_length:
  - 700
  - 1000

file_length:
  - 1400
  - 1800
